<!doctype html>
<html lang="ru">
  <head>
    <!-- Метаданные страницы ожидания и заголовок вкладки. -->
    <meta charset="UTF-8" />
    <title>Повторная попытка</title>
    <!-- Встроенные правила оформляют экран ожидания и обратный отсчет. -->
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #f5f7fa;
        color: #333;
        text-align: center;
        padding: 40px 16px;
      }

      .box {
        max-width: 420px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 12px;
        padding: 32px 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        font-size: 20px;
        margin-bottom: 12px;
      }

      p {
        font-size: 14px;
        line-height: 1.5;
        margin: 8px 0;
      }

      .timer {
        font-size: 36px;
        font-weight: 600;
        margin: 16px 0;
        color: #1976d2;
      }

      .hint {
        font-size: 12px;
        color: #777;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <!-- Сообщение о недоступности портала, таймер и пояснение автоматического перехода. -->
    <div class="box">
      <h1>Сайт временно недоступен</h1>

      <p>Мы попробуем снова через</p>

      <div class="timer">360</div>

      <p>
        Если ошибка сохранится, вы будете автоматически перенаправлены на
        альтернативную официальную страницу записи.
      </p>

      <p class="hint">
        Ничего делать не нужно - процесс продолжится автоматически
      </p>
    </div>

    <!-- Подключает скрипт, который обновляет счетчик и выполняет перенаправление. -->
    <script src="redirect.js"></script>
  </body>
</html>
